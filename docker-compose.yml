services:
  haushalts-board:
    image: ghcr.io/joni9993/haushalts-board:latest
    container_name: haushalts-board
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "4567:4567"
    volumes:
      - haushalt-data:/app/var
    environment:
      - TZ=Europe/Berlin
      # - LOG_LEVEL=INFO

volumes:
  haushalt-data:
